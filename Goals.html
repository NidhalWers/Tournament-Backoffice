<script>

function getGoalsForMatch(matchId) {
  return goalsData.filter(g => g.matchId === matchId);
}

let currentMatchId = null;
let currentScores = null;

function saveScore(matchId) {
  const scoreA = parseInt(document.getElementById("a_" + matchId).value);
  const scoreB = parseInt(document.getElementById("b_" + matchId).value);

  currentMatchId = matchId;
  currentScores = { scoreA, scoreB };

  openGoalModal(matchId, scoreA, scoreB);
}

function openGoalModal(matchId, scoreA, scoreB) {
  const container = document.getElementById("goalInputs");
  container.innerHTML = "";

  let html = "<h4>Équipe A</h4>";

  for (let i = 0; i < scoreA; i++) {
    html += `<input placeholder="Buteur A ${i+1}" id="goalA_${i}" /><br>`;
  }

  html += "<h4>Équipe B</h4>";

  for (let i = 0; i < scoreB; i++) {
    html += `<input placeholder="Buteur B ${i+1}" id="goalB_${i}" /><br>`;
  }

  container.innerHTML = html;

  document.getElementById("goalModal").style.display = "block";
}

function closeModal() {
  document.getElementById("goalModal").style.display = "none";
}

function submitGoals() {
  showLoader(); 

  google.script.run
    .withSuccessHandler(function(teamNames) {
      hideLoader();

      const goals = [];
      // équipe A
      for (let i = 0; i < currentScores.scoreA; i++) {
        const name = document.getElementById("goalA_" + i).value;
        if (name){ 
          goals.push({
            team: "A",
            player: name,
            teamName: teamNames.teamAName
          });
        }
      }

      // équipe B
      for (let i = 0; i < currentScores.scoreB; i++) {
        const name = document.getElementById("goalB_" + i).value;
        if (name){
            goals.push({
            team: "B",
            player: name,
            teamName: teamNames.teamBName
          });
        }
      }

      // save
      showLoader(); 
      
      google.script.run
        .withSuccessHandler(() => {
          hideLoader();
          closeModal();
          loadTournament();
        })
        .saveMatchWithGoals(
          currentMatchId,
          currentScores.scoreA,
          currentScores.scoreB,
          goals
        );

    })
    .withFailureHandler(err => {
      hideLoader();
      alert(err.message);
    })
    .getTeamNamesByMatchId(currentMatchId);
}
</script>
