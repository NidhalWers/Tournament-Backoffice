<script>

  function escapeHtml(value) {
    const element = document.createElement("div");
    element.textContent = value == null ? "" : String(value);
    return element.innerHTML;
  }

  function getGoalsForMatch(matchId) {
    return goalsData.filter(g => g.matchId === matchId);
  }

  let currentMatchId = null;
  let currentScores = null;
  let currentMatch = null;

  function saveScore(matchId) {
    const scoreA = parseInt(document.getElementById("a_" + matchId).value);
    const scoreB = parseInt(document.getElementById("b_" + matchId).value);

    currentMatchId = matchId;
    currentScores = { scoreA, scoreB };
    currentMatch = findMatchById(matchId);

    openGoalModal(matchId, scoreA, scoreB);
  }

  function openGoalModal(matchId, scoreA, scoreB) {
    const container = document.getElementById("goalInputs");
    container.innerHTML = "";

    let html = "<h4>Équipe A</h4>";

    for (let i = 0; i < scoreA; i++) {
      html += `<input placeholder="Buteur A ${i + 1}" id="goalA_${i}" /><br>`;
    }

    html += "<h4>Équipe B</h4>";

    for (let i = 0; i < scoreB; i++) {
      html += `<input placeholder="Buteur B ${i + 1}" id="goalB_${i}" /><br>`;
    }

    html += `
    <hr>

    <h4>Respect & Solidarité - Équipe A</h4>

    Cartons rouges :
    <input type="number" id="redA" min="0" value="0"><br>

    Rouges insulte / bagarre :
    <input type="number" id="seriousRedA" min="0" value="0"><br>

    <hr>

    <h4>Respect & Solidarité - Équipe B</h4>

    Cartons rouges :
    <input type="number" id="redB" min="0" value="0"><br>

    Rouges insulte / bagarre :
    <input type="number" id="seriousRedB" min="0" value="0"><br>

    <hr>

    <h4>Point solidarité</h4>

    <label>Equipe ayant fourni un arbitre :</label><br>

    <select id="solidarityTeam">
        <option value="">Aucune</option>
    </select>
  `;

    const isKnockout =
      currentMatch.stage === "QF" ||
      currentMatch.stage === "SF" ||
      currentMatch.stage === "FINAL";

    if (scoreA === scoreB && isKnockout) {
      html += `
      <hr>
      <h4>Vainqueur aux tirs au but</h4>

      <label>
        <input type="radio" name="penaltyWinner" value="A">
        ${currentMatch.teamA}
      </label>

      <label style="margin-left:10px;">
        <input type="radio" name="penaltyWinner" value="B">
        ${currentMatch.teamB}
      </label>
    `;
    }

    google.script.run
      .withSuccessHandler(function (teams) {

        const select = document.getElementById("solidarityTeam");

        teams.forEach(team => {
          const option = document.createElement("option");
          option.value = team.id;
          option.textContent = team.name;
          select.appendChild(option);
        });

      })
      .getTournamentTeams(currentMatchId);

    container.innerHTML = html;

    document.getElementById("goalModal").style.display = "block";
  }

  function closeModal() {
    document.getElementById("goalModal").style.display = "none";
  }

  function submitGoals() {
    const isKnockout =
      currentMatch.stage === "QF" ||
      currentMatch.stage === "SF" ||
      currentMatch.stage === "FINAL";

    let penaltyWinner = null;

    if (isKnockout && currentScores.scoreA === currentScores.scoreB) {
      const checked = document.querySelector('input[name="penaltyWinner"]:checked');

      if (!checked) {
        alert("Choisir un vainqueur aux tirs au but");
        return;
      }

      penaltyWinner = checked.value;
    }

    showLoader();

    google.script.run
      .withSuccessHandler(function (teamNames) {
        hideLoader();

        const goals = [];
        // équipe A
        for (let i = 0; i < currentScores.scoreA; i++) {
          const name = document.getElementById("goalA_" + i).value.trim();
          if (name) {
            goals.push({
              team: "A",
              player: name,
              teamName: teamNames.teamAName
            });
          }
        }

        // équipe B
        for (let i = 0; i < currentScores.scoreB; i++) {
          const name = document.getElementById("goalB_" + i).value.trim();
          if (name) {
            goals.push({
              team: "B",
              player: name,
              teamName: teamNames.teamBName
            });
          }
        }

        const fairPlay = {
          teamA: {
            redCards: parseInt(document.getElementById("redA").value) || 0,
            seriousRedCards: parseInt(document.getElementById("seriousRedA").value) || 0
          },
          teamB: {
            redCards: parseInt(document.getElementById("redB").value) || 0,
            seriousRedCards: parseInt(document.getElementById("seriousRedB").value) || 0
          },
          solidarityTeamId: document.getElementById("solidarityTeam").value
        };

        // save
        showLoader();

        google.script.run
          .withSuccessHandler(() => {
            hideLoader();
            closeModal();
            loadTournament();
          })
          .saveMatchWithGoals(
            currentMatchId,
            currentScores.scoreA,
            currentScores.scoreB,
            goals,
            penaltyWinner,
            fairPlay
          );

      })
      .withFailureHandler(err => {
        hideLoader();
        alert(err.message);
      })
      .getTeamNamesByMatchId(currentMatchId);
  }
</script>
