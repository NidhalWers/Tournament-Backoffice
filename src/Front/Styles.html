<style>
  body {
    font-family: Arial;
  }

  .match {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .match.played {
    border-radius: 5px;
    padding: 4px;
    opacity: 0.7;
  }

  .team {
    width: 150px;
    font-weight: bold;
  }

  .team-left {
    text-align: right;
  }

  .team-right {
    text-align: left;
  }

  .score {
    width: 40px;
    text-align: center;
    padding: 4px;
  }

  .dash {
    font-weight: bold;
  }

  .save-btn {
    padding: 4px 10px;
    border: none;
    background-color: #4CAF50;
    color: white;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }

  .save-btn:hover {
    background-color: #45a049;
  }

  .forfeit-btn {
    padding: 4px 10px;
    border: none;
    background-color: #D22B2B;
    color: white;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }

  .forfeit-btn:hover {
    background-color: #FAA0A0;
  }

  table {
    width: 100%;
    margin-bottom: 20px;
  }

  th,
  td {
    padding: 4px;
    text-align: center;
  }

  td:first-child {
    text-align: left;
  }

  .top-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  .tabs button {
    padding: 6px 12px;
    margin-right: 5px;
    cursor: pointer;
  }

  .actions {
    margin-bottom: 15px;
  }

  .groups-container {
    display: flex;
    gap: 40px;
    align-items: flex-start;
  }

  #matches {
    flex: 2;
    min-width: 0;
  }

  #standings {
    flex: 1;
    min-width: 300px;
  }

  .schedule-panel {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 16px 18px;
    margin-bottom: 22px;
    border: 1px solid #dcebdc;
    border-radius: 12px;
    background: linear-gradient(135deg, #f7fbf7, #eef7ef);
    box-shadow: 0 3px 12px rgba(33, 85, 38, 0.08);
  }

  .schedule-heading {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 250px;
  }

  .schedule-heading h3,
  .schedule-heading p {
    margin: 0;
  }

  .schedule-heading p {
    margin-top: 4px;
    color: #607064;
    font-size: 12px;
  }

  .schedule-icon {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    border-radius: 10px;
    background: #dcefdc;
    font-size: 20px;
  }

  .schedule-controls {
    display: flex;
    align-items: flex-end;
    gap: 12px;
  }

  .schedule-field {
    display: flex;
    flex-direction: column;
    gap: 5px;
    color: #344438;
    font-size: 12px;
    font-weight: bold;
  }

  .schedule-field input,
  .schedule-field select {
    box-sizing: border-box;
    height: 38px;
    padding: 0 10px;
    border: 1px solid #b8c9bb;
    border-radius: 7px;
    background: white;
    color: #1f2b21;
    font: inherit;
    font-size: 14px;
  }

  .schedule-field input:focus,
  .schedule-field select:focus {
    border-color: #4CAF50;
    outline: 3px solid rgba(76, 175, 80, 0.15);
  }

  .schedule-break {
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 38px;
    padding: 0 12px;
    border-radius: 7px;
    background: white;
    color: #526056;
    font-size: 11px;
  }

  .schedule-break strong {
    color: #2d7133;
    font-size: 13px;
  }

  .schedule-summary {
    min-width: 165px;
    margin-left: auto;
    padding-left: 18px;
    border-left: 1px solid #cddfce;
    color: #38513c;
    font-size: 13px;
    font-weight: bold;
    line-height: 1.4;
  }

  .match-time {
    display: flex;
    flex: 0 0 62px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    min-height: 42px;
    margin-right: 4px;
    padding: 4px 7px;
    border: 1px solid #d7e8d8;
    border-radius: 7px;
    background: #f2f8f2;
  }

  .match-time span {
    color: #718074;
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .match-time time {
    margin-top: 2px;
    color: #25632b;
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
  }

  .bracket {
    display: flex;
    gap: 40px;
  }

  .round {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .bracket-match {
    border: 1px solid #ccc;
    padding: 8px;
    border-radius: 6px;
    width: 150px;
    background: #f9f9f9;
  }

  .team-line {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .team-line input {
    width: 50px;
  }

  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
  }

  .modal-content {
    background: white;
    padding: 20px;
    margin: 100px auto;
    width: 300px;
    border-radius: 8px;
  }

  .match-wrapper {
    display: flex;
    flex-direction: column;
    margin-bottom: 12px;
  }

  .match-line {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .goals-container {
    margin-top: 4px;
  }

  .goals-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
  }

  .goal-left {
    width: 50%;
    text-align: left;
  }

  .goal-right {
    width: 50%;
    text-align: right;
  }

  .bracket-match .match-wrapper {
    display: flex;
    flex-direction: column;
    /* 🔥 CRUCIAL */
    gap: 4px;
  }

  .bracket-match .goals-container {
    margin-top: 4px;
  }

  .bracket-match .goals-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
  }

  .bracket-match .goal-left {
    width: 50%;
    text-align: left;
  }

  .bracket-match .goal-right {
    width: 50%;
    text-align: right;
  }

  #statsTab table {
    border-collapse: collapse;
    width: 400px;
  }

  #statsTab th,
  #statsTab td {
    border: 1px solid #ddd;
    padding: 6px;
    text-align: center;
  }

  #statsTab th {
    background-color: #f4f4f4;
  }

  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }

  .tab {
    padding: 8px 16px;
    border: none;
    background: #eee;
    cursor: pointer;
    border-radius: 6px;
    font-weight: bold;
    transition: all 0.2s ease;
  }

  .tab:hover {
    background: #ddd;
  }

  /* Active tab */
  .tab.active {
    background: #4CAF50;
    color: white;
  }

  /* Animation */
  .tab:active {
    transform: scale(0.95);
  }

  .loader-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 5px solid #ccc;
    border-top: 5px solid #4CAF50;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  .bracket-ldc {
    display: flex;
    justify-content: center;
    gap: 40px;
    align-items: flex-start;
  }

  .round {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 40px;
  }

  .round:nth-child(2),
  .round:nth-child(4) {
    margin-top: 40px;
  }

  .round:nth-child(3) {
    margin-top: 80px;
  }

  .side {
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .center {
    display: flex;
    align-items: center;
  }

  .round {
    display: flex;
    flex-direction: column;
    gap: 30px;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  @media (max-width: 1000px) {
    .schedule-panel {
      align-items: stretch;
      flex-wrap: wrap;
    }

    .schedule-summary {
      width: 100%;
      margin-left: 0;
      padding: 10px 0 0;
      border-top: 1px solid #cddfce;
      border-left: 0;
    }

    .groups-container {
      flex-direction: column;
    }

    #matches,
    #standings {
      width: 100%;
    }

    .match {
      overflow-x: auto;
    }

    .match-line {
      min-width: 720px;
    }
  }

  @media (max-width: 620px) {
    .schedule-controls {
      width: 100%;
      flex-wrap: wrap;
    }

    .schedule-field {
      flex: 1;
      min-width: 130px;
    }

    .schedule-field input,
    .schedule-field select {
      width: 100%;
    }
  }
</style>
