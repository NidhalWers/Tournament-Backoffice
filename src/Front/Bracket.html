<script>

  function renderBracket(matches) {
    const container = document.getElementById("bracket");
    container.innerHTML = "";

    const qf = matches.filter(m => m.stage === "QF");
    if (qf != null) {
      const sf = matches.filter(m => m.stage === "SF");
      const final = matches.filter(m => m.stage === "FINAL");

      const wrapper = document.createElement("div");
      wrapper.className = "bracket-ldc";

      wrapper.innerHTML = `
      <div class="round">${qf.slice(0, 2).map(renderMatch).join("")}</div>
      <div class="round">${[sf[0]].map(renderMatch).join("")}</div>
      <div class="round">${final.map(renderMatch).join("")}</div>
      <div class="round">${[sf[1]].map(renderMatch).join("")}</div>
      <div class="round">${qf.slice(2, 4).map(renderMatch).join("")}</div>
    `;

      container.appendChild(wrapper);
    }
  }

  function renderColumn(matches) {
    return `
    <div class="round">
      ${matches.map(m => renderMatch(m)).join("")}
    </div>
  `;
  }

  function generateFinalPhase() {
    const tournamentId = document.getElementById("tournamentSelect").value;

    showLoader();

    google.script.run
      .withSuccessHandler(function (res) {
        hideLoader();
        alert("Phases finale générés !");

        if (res && res.tieBreakDetected) {
          alert("⚖️ Égalité parfaite entre équipes à la 3eme place — tirage au sort effectué");
        }

        loadTournament();
      })
      .withFailureHandler(err => {
        hideLoader();
        alert(err.message);
      })
      .generateFinalPhase(tournamentId);
  }

</script>
