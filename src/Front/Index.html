<!DOCTYPE html>
<html>

<head>
  <base target="_top">

  <?!= include('Styles'); ?>
</head>

<body>

  <h2>Tournament Management</h2>

  <div class="top-bar">
    <select id="tournamentSelect" onchange="onTournamentChange()"></select>
  </div>

  <div class="tabs">
    <button id="tab-groups" class="tab active" onclick="showTab('groups')">
      🏆 Groups
    </button>
    <button id="tab-knockout" class="tab" onclick="showTab('knockout')">
      ⚔️ Knockout Stage
    </button>
    <button id="tab-stats" class="tab" onclick="showTab('stats')">
      📊 Stats
    </button>
  </div>

  <hr>

  <div id="groupsTab">
    <div class="actions">
      <button onclick="generateMatches()">Generate Group Matches</button>
    </div>

    <div class="groups-container" style="display:flex; gap:40px;">
      <div id="matches" style="flex:2;"></div>
      <div id="standings" style="flex:1;"></div>
    </div>
  </div>

  <div id="knockoutTab" style="display:none;">
    <div class="actions">
      <button id="btnQuarters" onclick="generateFinalPhase()">
        Generate Knockout Stage
      </button>
    </div>

    <div id="bracket"></div>
  </div>

  <div id="goalModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>Enter Scorers</h3>
      <div id="goalInputs"></div>
      <button onclick="submitGoals()">Confirm</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <div id="statsTab" style="display:none;">
    <h2>Top Scorers</h2>
    <div id="scorers"></div>
  </div>

  <?!= include('Matches'); ?>
  <?!= include('Bracket'); ?>
  <?!= include('Goals'); ?>
  <?!= include('Stats'); ?>

  <div id="loader" class="loader-overlay" style="display:none;">
    <div class="spinner"></div>
  </div>

</body>

</html>
