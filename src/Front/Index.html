<!DOCTYPE html>
<html>

<head>
  <base target="_top">

  <?!= include('Styles'); ?>
</head>

<body>

  <h2>Tournament Management</h2>

  <div class="top-bar">
    <select id="tournamentSelect" onchange="onTournamentChange()"></select>
  </div>

  <div class="tabs">
    <button id="tab-groups" class="tab active" onclick="showTab('groups')">
      🏆 Groups
    </button>
    <button id="tab-knockout" class="tab" onclick="showTab('knockout')">
      ⚔️ Knockout Stage
    </button>
    <button id="tab-stats" class="tab" onclick="showTab('stats')">
      📊 Stats
    </button>
  </div>

  <hr>

  <div id="groupsTab">
    <div class="actions">
      <button onclick="generateMatches()">Generate Group Matches</button>
    </div>

    <section class="schedule-panel" aria-labelledby="scheduleTitle">
      <div class="schedule-heading">
        <span class="schedule-icon" aria-hidden="true">🕒</span>
        <div>
          <h3 id="scheduleTitle">Match schedule</h3>
          <p>Times are calculated automatically and are not saved.</p>
        </div>
      </div>

      <div class="schedule-controls">
        <label class="schedule-field" for="groupScheduleStart">
          <span>Start time</span>
          <input id="groupScheduleStart" type="time" value="09:00" oninput="updateGroupMatchSchedule()">
        </label>

        <label class="schedule-field" for="groupMatchDuration">
          <span>Match duration</span>
          <select id="groupMatchDuration" onchange="updateGroupMatchSchedule()">
            <option value="5">5 min</option>
            <option value="10" selected>10 min</option>
            <option value="12">12 min</option>
            <option value="15">15 min</option>
            <option value="20">20 min</option>
            <option value="25">25 min</option>
            <option value="30">30 min</option>
          </select>
        </label>

        <div class="schedule-break" title="Time between the end of a match and the start of the next one">
          <strong>+3 min</strong>
          <span>between matches</span>
        </div>
      </div>

      <div id="groupScheduleSummary" class="schedule-summary" aria-live="polite">
        Load a tournament to calculate the schedule.
      </div>
    </section>

    <div class="groups-container">
      <div id="matches"></div>
      <div id="standings"></div>
    </div>
  </div>

  <div id="knockoutTab" style="display:none;">
    <div class="actions">
      <button id="btnQuarters" onclick="generateFinalPhase()">
        Generate Knockout Stage
      </button>
    </div>

    <div id="bracket"></div>
  </div>

  <div id="goalModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>Enter Scorers</h3>
      <div id="goalInputs"></div>
      <button onclick="submitGoals()">Confirm</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <div id="statsTab" style="display:none;">
    <h2>Top Scorers</h2>
    <div id="scorers"></div>
  </div>

  <?!= include('Main'); ?>
  <?!= include('Matches'); ?>
  <?!= include('Bracket'); ?>
  <?!= include('Goals'); ?>
  <?!= include('Stats'); ?>

  <div id="loader" class="loader-overlay" style="display:none;">
    <div class="spinner"></div>
  </div>

</body>

</html>
