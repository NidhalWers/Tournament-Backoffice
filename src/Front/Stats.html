<script>

  function loadScorers() {
    const tournamentId = document.getElementById("tournamentSelect").value;

    showLoader();

    google.script.run
      .withSuccessHandler(renderScorers)
      .computeTopScorers(tournamentId);
  }

  function renderScorers(data) {
    hideLoader();
    const container = document.getElementById("scorers");

    if (!data || data.length === 0) {
      container.innerHTML = "<p>No scorers</p>";
      return;
    }

    let html = `
    <table>
      <tr>
        <th>#</th>
        <th>Player</th>
        <th>Team</th>
        <th>Goals</th>
      </tr>
  `;

    data.forEach((s, i) => {
      html += `
      <tr>
        <td>${i + 1}</td>
        <td>${escapeHtml(s.player)}</td>
        <td>${escapeHtml(s.team)}</td>
        <td>${s.goals}</td>
      </tr>
    `;
    });

    html += "</table>";

    container.innerHTML = html;
  }

</script>
