<script>

  function renderMatch(m) {
    const disabled = (m.played || !m.teamA || !m.teamB) ? "disabled" : "";

    return `
    <div class="bracket-match">
      <div class="match-wrapper">

        <div class="team-line">
          <span>${m.teamAName || "-"}</span>
          <div class="score-actions">
            <input type="number" min="0" id="a_${m.id}" value="${m.scoreA || ""}" ${disabled}/>
            <button class="forfeit-btn" ${disabled} onclick="setForfeit('${m.id}', 'A')">Forfeit</button>
          </div>
        </div>

        <div class="team-line">
          <span>${m.teamBName || "-"}</span>
          <div class="score-actions">
            <input type="number" min="0" id="b_${m.id}" value="${m.scoreB || ""}" ${disabled}/>
            <button class="forfeit-btn" ${disabled} onclick="setForfeit('${m.id}', 'B')">Forfeit</button>
          </div>
        </div>

        ${(!m.played && m.teamA && m.teamB)
        ? `<button class="save-btn" onclick="saveScore('${m.id}')">Save Score</button>`
        : `<span class="played">✔</span>`
      }

      </div>
    </div>
  `;
  }

  function renderMatches(matches) {
    const container = document.getElementById("matches");
    container.innerHTML = "";

    if (!matches || matches.length === 0) {
      container.innerHTML = "<p>No matches</p>";
      updateGroupMatchSchedule();
      return;
    }

    const groups = {};

    matches.forEach(m => {
      if (!groups[m.group]) groups[m.group] = [];
      groups[m.group].push(m);
    });

    Object.keys(groups).forEach(group => {
      const title = document.createElement("h3");
      title.innerText = "Group " + group;
      container.appendChild(title);

      groups[group].forEach((m, matchIndex) => {
        const div = document.createElement("div");
        div.className = "match " + (m.played ? "played" : "");
        const disabled = m.played ? "disabled" : "";

        const goals = getGoalsForMatch(m.id);
        const goalsA = goals.filter(g => g.team === "A");
        const goalsB = goals.filter(g => g.team === "B");

        // Balance the display row by row
        const maxGoals = Math.max(goalsA.length, goalsB.length);

        let goalsHtml = "";
        for (let i = 0; i < maxGoals; i++) {
          goalsHtml += `
          <div class="goals-row">
            <div class="goal-left">${goalsA[i] ? "⚽ " + escapeHtml(goalsA[i].playerName) : ""}</div>
            <div class="goal-right">${goalsB[i] ? "⚽ " + escapeHtml(goalsB[i].playerName) : ""}</div>
          </div>
        `;
        }

        div.innerHTML = `
        <div class="match-wrapper">
          <div class="match-line">
            <div class="match-time">
              <span>Match ${matchIndex + 1}</span>
              <time data-group-match-index="${matchIndex}">--:--</time>
            </div>
            
            <span class="team team-left">${m.teamAName}</span>
            <button class="forfeit-btn" ${disabled} onclick="setForfeit('${m.id}', 'A')">Forfeit</button>

            <input class="score" ${disabled} type="number" min="0" step="1" id="a_${m.id}" value="${m.scoreA || ""}" />
            
            <span class="dash">-</span>

            <input class="score" ${disabled} type="number" min="0" step="1" id="b_${m.id}" value="${m.scoreB || ""}" />

            <button class="forfeit-btn" ${disabled} onclick="setForfeit('${m.id}', 'B')">Forfeit</button>
            <span class="team team-right">${m.teamBName}</span>
            
            <button class="save-btn" ${disabled} onclick="saveScore('${m.id}')">Save Score</button>
          </div>

          <div class="goals-container">
            ${goalsHtml}
          </div>

          ${renderMatchRefereeSelector(m)}
        </div>
      `;

        container.appendChild(div);
      });
    });

    updateGroupMatchSchedule();
  }

  function updateGroupMatchSchedule() {
    const startInput = document.getElementById("groupScheduleStart");
    const durationSelect = document.getElementById("groupMatchDuration");
    const summary = document.getElementById("groupScheduleSummary");

    if (!startInput || !durationSelect || !summary) return;

    const scheduledMatches = document.querySelectorAll("[data-group-match-index]");
    const totalMatches = scheduledMatches.length;
    const slotCount = Array.from(scheduledMatches).reduce((maximum, timeElement) => {
      return Math.max(maximum, Number(timeElement.dataset.groupMatchIndex) + 1);
    }, 0);
    const startTime = startInput.value;
    const duration = Number(durationSelect.value);

    scheduledMatches.forEach(timeElement => {
      const matchIndex = Number(timeElement.dataset.groupMatchIndex);
      const scheduledTime = calculateGroupMatchTime(startTime, matchIndex * (duration + 3));

      timeElement.textContent = scheduledTime ? scheduledTime.label : "--:--";
      timeElement.dateTime = scheduledTime ? scheduledTime.time : "";
    });

    if (totalMatches === 0) {
      summary.textContent = "No group matches to schedule yet.";
      return;
    }

    if (!startTime) {
      summary.textContent = "Choose a start time to display the schedule.";
      return;
    }

    const finishOffset = (slotCount - 1) * (duration + 3) + duration;
    const finishTime = calculateGroupMatchTime(startTime, finishOffset);

    summary.textContent = finishTime
      ? `${totalMatches} matches · ${slotCount} time slots · Estimated finish ${finishTime.label}`
      : "Choose a valid start time.";
  }

  function calculateGroupMatchTime(startTime, offsetMinutes) {
    if (!/^\d{2}:\d{2}$/.test(startTime) || !Number.isFinite(offsetMinutes)) return null;

    const [hours, minutes] = startTime.split(":").map(Number);

    if (hours > 23 || minutes > 59) return null;

    const totalMinutes = hours * 60 + minutes + offsetMinutes;
    const minutesInDay = 24 * 60;
    const normalizedMinutes = totalMinutes % minutesInDay;
    const dayOffset = Math.floor(totalMinutes / minutesInDay);
    const scheduledHours = String(Math.floor(normalizedMinutes / 60)).padStart(2, "0");
    const scheduledMinutes = String(normalizedMinutes % 60).padStart(2, "0");
    const time = `${scheduledHours}:${scheduledMinutes}`;
    const nextDayLabel = dayOffset > 0 ? ` (+${dayOffset} day${dayOffset > 1 ? "s" : ""})` : "";

    return {
      time,
      label: time + nextDayLabel
    };
  }


  function renderStandings(standings) {
    const container = document.getElementById("standings");
    container.innerHTML = "";

    Object.keys(standings).forEach(group => {
      const title = document.createElement("h3");
      title.innerText = "Group " + group + " Standings";
      container.appendChild(title);

      const table = document.createElement("table");
      table.border = "1";

      table.innerHTML = `
      <tr>
        <th>Team</th>
        <th>Pts</th>
        <th>MP</th>
        <th>W</th>
        <th>D</th>
        <th>L</th>
        <th>GF</th>
        <th>GA</th>
        <th>+/-</th>
        <th>FP</th>
      </tr>
    `;

      standings[group].forEach(t => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
        <td>${t.team}</td>
        <td>${t.pts}</td>
        <td>${t.played}</td>
        <td>${t.win}</td>
        <td>${t.draw}</td>
        <td>${t.loss}</td>
        <td>${t.gf}</td>
        <td>${t.ga}</td>
        <td>${t.gf - t.ga}</td>
        <td>${t.fairPlayScore}</td>
      `;

        table.appendChild(tr);
      });

      container.appendChild(table);
    });
  }

  function setForfeit(matchId, forfeitingTeam) {
    if (!confirm("Confirm the forfeit?")) return;

    let scoreA = 0;
    let scoreB = 0;

    if (forfeitingTeam === "A") {
      scoreA = 0;
      scoreB = 3;
    } else {
      scoreA = 3;
      scoreB = 0;
    }

    showLoader();

    google.script.run
      .withSuccessHandler(() => {
        hideLoader();
        loadTournament();
      })
      .withFailureHandler(err => {
        hideLoader();
        alert(err.message);
      })
      .saveForfeit(matchId, scoreA, scoreB);
  }

  function findMatchById(matchId) {
    const allMatches = [
      ...(window.currentGroupMatches || []),
      ...(window.currentKnockoutMatches || [])
    ];

    return allMatches.find(m => String(m.id) === String(matchId));
  }

</script>
